name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP (Pint, PHPStan, Pest) — store=${{ matrix.store }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: json
            services: false
          - store: mysql
            services: true

    services:
      mysql:
        image: ${{ matrix.services && 'mysql:8.0' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: serwis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATA_STORE: ${{ matrix.store }}
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: serwis_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Assert the project uses no Node and no Python (decision D1)
        run: |
          test ! -f package.json
          test ! -f yarn.lock
          test ! -f pnpm-lock.yaml
          test ! -f vite.config.js
          ! find . -name '*.py' -not -path './vendor/*' | grep -q .

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, fileinfo, intl, zip, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Apply migrations (mysql job only)
        if: matrix.services
        run: php artisan migrate --force

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

      - name: Verify the active store
        run: php artisan store:check

      - name: Verify the PWA icons
        run: |
          php artisan icons:generate
          php artisan icons:check
